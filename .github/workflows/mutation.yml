name: Mutation Tests

# ミューテーションテストは通常のテストと桁が違うほど重い。
# ローカル実測（24 コア / Node 22.23.2）で core 609 変異 2m29s・geo 360 変異 1m09s・
# api 98 変異 3m32s。CI ランナーではコア数が少ないぶんさらに遅い。
# push のたびに回すとフィードバックが鈍り、
# 待ち時間の長さから CI 自体が無視されるようになる。
# そのため ci.yml から切り離し、手動実行と週次バッチだけにする。
on:
  workflow_dispatch:
  schedule:
    # cron は UTC 固定。日曜 18:00 UTC = 月曜 03:00 JST に週 1 回走らせ、
    # 週明けにスコアの劣化を確認できる状態にする。
    - cron: '0 18 * * 0'

# 長時間ジョブなので、手動実行を連打したときに何本も並走しないよう 1 本に絞る。
# ただし走り切ったスコアには意味があるため、途中キャンセルはしない。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    name: Stryker（${{ matrix.workspace }}）
    runs-on: ubuntu-latest
    # 最も遅い api でもローカル 3m32s。CI のコア数が少ないぶん concurrency が
    # 下がって変異あたりの待ちが伸びるため、実測の 10 倍近い余裕を取る。
    # 暴走（無限ループ変異が timeoutMS をすり抜けるなど）は確実にここで止める。
    timeout-minutes: 40
    strategy:
      # 1 つがしきい値割れしても、残りのスコアは知りたいので止めない。
      fail-fast: false
      matrix:
        # stryker.config.mjs を持つ 3 ワークスペース。apps/mobile は Jest で
        # テストしており Stryker のスクリプトも設定も無いので入らない。
        # ルートの `npm run test:mutation` でも同じ 3 つが回るが、それだと
        # 1 ジョブ直列 7 分になり、どれが落ちたかもログを追わないと分からない。
        # 並べて別ジョブにすることで、失敗したワークスペースが名前で分かる。
        # 遅い順（api > core > geo）に並べ、ランナーが空き次第 api から着手させる。
        workspace: ['@meshimap/api', '@meshimap/core', '@meshimap/geo']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # ci.yml と同じく .nvmrc を唯一の正とする。
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: 依存をインストール
        run: npm ci
      - name: stryker run
        # しきい値（thresholds.break: 85）はルートの stryker.base.mjs 側に書いてある。
        # CI から --break などを重ねて渡すと設定が二重管理になり、
        # ローカル実行と CI で判定が食い違う余地を作るので何も足さない。
        #
        # 85 はあくまで下限。2026-09-15 時点の実測は 3 つとも 100%
        # （core 609 変異 Survived 0 / geo 360 変異 Survived 0 / api 98 変異 Survived 0）。
        # 下回ったらテストが変異を殺せていないということなので、
        # しきい値を下げて通すのではなくテストを足すこと。
        run: npm run test:mutation -w ${{ matrix.workspace }}
